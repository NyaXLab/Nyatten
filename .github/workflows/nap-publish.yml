name: Publish NAP version

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: nap-publish
    cancel-in-progress: false

jobs:
    nap-publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Publish
              run: |
                  MESSAGE=$(git log -1 --pretty=%s)
                  npx --yes @nyaitter/nap publish --message "$MESSAGE"
